{% extends "base.html" %}

{% block title %}Forgot Password - PocketSmart AI{% endblock %}

{% block content %}

<style>

.otp-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.otp-box {
    width: 45px;
    height: 50px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    border: 1px solid #ccc;
    border-radius: 8px;
}

#password-section {
    margin-top: 20px;
}

</style>


<div class="auth-box">

    <h2>Forgot Password</h2>

    <div id="alert-box"></div>


    <!-- EMAIL SECTION -->

    <div id="email-section">

        <div class="field">

            <label>Email ID</label>

            <input
                type="email"
                id="email"
                required
            >

        </div>

        <button
            type="button"
            class="btn full"
            id="send-otp-btn">

            Send OTP

        </button>

    </div>


    <!-- OTP SECTION -->

    <div
        id="otp-section"
        style="display:none;"
    >

        <p style="text-align:center;">
            Enter the 6-digit OTP sent to your email
        </p>


        <div class="otp-container">

            <input
                type="text"
                class="otp-box"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-box"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-box"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-box"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-box"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-box"
                maxlength="1"
                inputmode="numeric"
            >

        </div>


        <button
            type="button"
            class="btn full"
            id="verify-otp-btn">

            Verify OTP

        </button>


        <p style="text-align:center;">
            OTP is valid for <strong>1 minute</strong>.
        </p>

    </div>


    <!-- NEW PASSWORD SECTION -->

    <div
        id="password-section"
        style="display:none;"
    >

        <div class="field">

            <label>New Password</label>

            <input
                type="password"
                id="new-password"
                required
                minlength="6"
            >

        </div>


        <div class="field">

            <label>Confirm New Password</label>

            <input
                type="password"
                id="confirm-password"
                required
                minlength="6"
            >

        </div>


        <button
            type="button"
            class="btn full"
            id="change-password-btn">

            Change Password

        </button>

    </div>

</div>


<script>

let userEmail = "";
let resetToken = "";


/* =========================================
   SEND OTP
========================================= */

document
    .getElementById("send-otp-btn")
    .addEventListener("click", async () => {

        const alertBox =
            document.getElementById("alert-box");

        const email =
            document.getElementById("email").value.trim();


        if (!email) {

            alertBox.innerHTML =
                '<div class="alert error">Please enter your email ID.</div>';

            return;
        }


        try {

            const btn =
                document.getElementById("send-otp-btn");

            btn.disabled = true;

            btn.innerText =
                "Sending OTP...";


            const res = await fetch(
                "/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


            const data =
                await res.json();


            if (!res.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to send OTP"
                );

            }


            userEmail = email;


            alertBox.innerHTML =
                '<div class="alert success">OTP sent to your email.</div>';


            document
                .getElementById("otp-section")
                .style.display = "block";


            document
                .getElementById("email")
                .disabled = true;


            btn.style.display = "none";

        }

        catch (err) {

            const btn =
                document.getElementById("send-otp-btn");

            btn.disabled = false;

            btn.innerText =
                "Send OTP";


            alertBox.innerHTML =
                `<div class="alert error">${err.message}</div>`;

        }

    });


/* =========================================
   OTP BOXES
========================================= */

const otpBoxes =
    document.querySelectorAll(".otp-box");


otpBoxes.forEach((box, index) => {

    box.addEventListener("input", () => {

        box.value =
            box.value.replace(/\D/g, "");


        if (
            box.value &&
            index < otpBoxes.length - 1
        ) {

            otpBoxes[index + 1].focus();

        }

    });


    box.addEventListener("keydown", (e) => {

        if (
            e.key === "Backspace" &&
            !box.value &&
            index > 0
        ) {

            otpBoxes[index - 1].focus();

        }

    });

});


/* =========================================
   VERIFY OTP
========================================= */

document
    .getElementById("verify-otp-btn")
    .addEventListener("click", async () => {

        const alertBox =
            document.getElementById("alert-box");


        let otp = "";


        otpBoxes.forEach((box) => {

            otp += box.value;

        });


        if (otp.length !== 6) {

            alertBox.innerHTML =
                '<div class="alert error">Please enter all 6 digits of the OTP.</div>';

            return;

        }


        try {

            const verifyBtn =
                document.getElementById("verify-otp-btn");

            verifyBtn.disabled = true;


            const res = await fetch(
                "/verify-reset-otp",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: userEmail,
                        otp: otp
                    })
                }
            );


            const data =
                await res.json();


            if (!res.ok) {

                throw new Error(
                    data.detail ||
                    "OTP verification failed"
                );

            }


            /* Save reset token */

            resetToken =
                data.reset_token;


            alertBox.innerHTML =
                '<div class="alert success">OTP verified successfully.</div>';


            document
                .getElementById("otp-section")
                .style.display = "none";


            document
                .getElementById("password-section")
                .style.display = "block";

        }

        catch (err) {

            document
                .getElementById("verify-otp-btn")
                .disabled = false;

            alertBox.innerHTML =
                `<div class="alert error">${err.message}</div>`;

        }

    });


/* =========================================
   CHANGE PASSWORD
========================================= */

document
    .getElementById("change-password-btn")
    .addEventListener("click", async () => {

        const alertBox =
            document.getElementById("alert-box");


        const newPassword =
            document.getElementById("new-password").value;


        const confirmPassword =
            document.getElementById("confirm-password").value;


        /* Empty password check */

        if (!newPassword || !confirmPassword) {

            alertBox.innerHTML =
                '<div class="alert error">Please enter both passwords.</div>';

            return;

        }


        /* Password length */

        if (newPassword.length < 6) {

            alertBox.innerHTML =
                '<div class="alert error">Password must be at least 6 characters.</div>';

            return;

        }


        /* Password mismatch */

        if (newPassword !== confirmPassword) {

            alertBox.innerHTML =
                '<div class="alert error">Your password is mismatch.</div>';

            return;

        }


        try {

            const changeBtn =
                document.getElementById("change-password-btn");

            changeBtn.disabled = true;

            changeBtn.innerText =
                "Changing Password...";


            const res = await fetch(
                "/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: userEmail,

                        reset_token: resetToken,

                        new_password: newPassword

                    })
                }
            );


            const data =
                await res.json();


            if (!res.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to change password"
                );

            }


            alertBox.innerHTML =
                '<div class="alert success">Password changed successfully. You can now login with your new password.</div>';


            changeBtn.innerText =
                "Password Changed";


            setTimeout(() => {

                window.location.href =
                    "/login";

            }, 1800);

        }

        catch (err) {

            const changeBtn =
                document.getElementById("change-password-btn");

            changeBtn.disabled = false;

            changeBtn.innerText =
                "Change Password";


            alertBox.innerHTML =
                `<div class="alert error">${err.message}</div>`;

        }

    });

</script>

{% endblock %}
